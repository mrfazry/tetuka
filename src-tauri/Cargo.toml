[package]
name = "tetuka"
version = "0.1.0"
description = "Personal Instagram carousel image generator"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tetuka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.2.0", features = [] }
# Force build-time utils to match tauri-build 2.2.0 (not latest 2.9.x)
tauri-utils = { version = "=2.4.0", features = ["build"] }

[dependencies]
tauri = { version = "=2.2.0", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.2.0"
tauri-plugin-dialog = "=2.2.0"
tauri-plugin-fs = "=2.2.0"
tauri-plugin-updater = "=2.2.0"
tauri-plugin-process = "=2.2.0"
# Pin companion crates so caret ranges cannot float to incompatible minors
tauri-runtime = "=2.3.0"
tauri-runtime-wry = "=2.3.0"
tauri-utils = { version = "=2.4.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
