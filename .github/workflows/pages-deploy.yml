name: pages-deploy

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and deploy (tag or branch). Defaults to main."
        required: false
        type: string
        default: main

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout ref
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.ref }}"
            [ -n "$REF" ] || REF="main"
          else
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            # Tag pushes set head_branch to the tag name (e.g. v0.1.0)
            if [[ "$BRANCH" == v* ]]; then
              REF="$BRANCH"
            elif [ -n "$SHA" ]; then
              REF="$SHA"
            else
              echo "Could not resolve ref from workflow_run"
              exit 1
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Deploying ref $REF (repo ${{ github.repository }})"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tetuka
